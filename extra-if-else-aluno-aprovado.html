<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>If/Else — Aprovado ou Reprovado</title>
<link rel="stylesheet" href="extra-if-else-aluno-aprovado.css" />
</head>
<body>
  <h1>Aprovado ou Reprovado — if / else</h1>

  <label for="nome">Nome do aluno:</label>
  <input type="text" id="nome" placeholder="Ex: Maria">

  <label for="media">Média final (0 a 10):</label>
  <input type="number" id="media" step="0.1" min="0" max="10">

  <button id="btnVerificar">Verificar resultado ▶</button>
  <div id="resultado"></div>

<script src="extra-if-else-aluno-aprovado.js"></script>
</body>
</html>
